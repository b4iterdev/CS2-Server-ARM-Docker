name: Build and Push to GHCR

on:
  push:
    branches: [ "main" ] # Triggers the build whenever you push to main
  workflow_dispatch: # Allows you to trigger the build manually from the UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile # Change to ./Dockerfile.generic if you aren't on Oracle Ampere
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cs2-arm-server:latest
